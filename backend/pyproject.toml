[project]
name = "agentloop-local-experiment-launcher"
version = "0.1.0"
description = "Customer-side launcher for AgentLoop offline experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentloop-sdk==1.0.3",
  "alibabacloud-agentloop20260520==2.3.1",
  "aliyun-log-python-sdk==0.9.48",
  "cryptography>=43.0,<46",
  "fastapi>=0.115,<1",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
]

[project.scripts]
agentloop-launcher = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
]
package = [
  "pyinstaller>=6.14,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
